name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/autonomy.test.mjs
      - run: node scripts/report.mjs > /tmp/r.json && git diff --exit-code results/results.json
